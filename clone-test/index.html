<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ef">
  <title>FILT — Project Preview</title>
  <style>
    :root { color-scheme: light; --ink:#171715; --muted:#77766f; --line:#d8d7d0; --paper:#f4f3ef; --accent:#bd005e; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,"Noto Sans KR",sans-serif; }
    main { width:min(1120px, calc(100% - 48px)); margin:0 auto; padding:64px 0 80px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--ink); padding-bottom:22px; }
    .brand { font-size:13px; font-weight:700; letter-spacing:.14em; }
    .label { color:var(--muted); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:70px 0 10px; font-size:clamp(38px,7vw,76px); font-weight:500; letter-spacing:-.055em; line-height:.98; }
    .intro { color:var(--muted); font-size:14px; line-height:1.7; }
    .projects { margin-top:64px; border-top:1px solid var(--ink); }
    .project { display:grid; grid-template-columns:1fr 190px; gap:28px; padding:24px 0; border-bottom:1px solid var(--line); align-items:center; }
    h2 { margin:0 0 7px; font-size:20px; font-weight:500; letter-spacing:-.03em; }
    .project p { margin:0; color:var(--muted); font-size:12px; line-height:1.6; }
    nav { display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
    a { color:var(--ink); text-decoration:none; }
    .button { display:inline-flex; min-width:76px; justify-content:center; padding:11px 14px; border:1px solid var(--ink); border-radius:999px; font-size:11px; transition:background .2s,color .2s; }
    .button:hover { background:var(--ink); color:white; }
    footer { padding-top:24px; color:var(--muted); font-size:10px; letter-spacing:.08em; }
    @media (max-width:640px) {
      main { width:calc(100% - 32px); padding-top:28px; }
      h1 { margin-top:52px; }
      .projects { margin-top:46px; }
      .project { grid-template-columns:1fr; gap:16px; padding:20px 0; }
      nav { justify-content:flex-start; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <a class="brand" href="./">FILT.</a>
      <span class="label">Independent Preview · tempin-clone-test</span>
    </header>

    <h1>PROJECT<br>PREVIEW</h1>
    <p class="intro">아임웹 테스트 페이지를 독립 주소에서 확인하는 미리보기입니다.<br>화면에 맞는 PC 또는 모바일 버전을 선택하세요.</p>

    <section class="projects" aria-label="페이지 미리보기">
      <article class="project">
        <div><h2>HOME</h2><p>홈 화면 복제본</p></div>
        <nav><a class="button" href="pages/home-pc.html">PC 보기</a><a class="button" href="pages/home-mobile.html">모바일 보기</a></nav>
      </article>
      <article class="project">
        <div><h2>WORKS</h2><p>프로젝트 목록 복제본</p></div>
        <nav><a class="button" href="pages/works-pc.html">PC 보기</a><a class="button" href="pages/works-mobile.html">모바일 보기</a></nav>
      </article>
      <article class="project">
        <div><h2>TEMPIN OFFICE</h2><p>프로젝트 상세 페이지 복제본</p></div>
        <nav><a class="button" href="pages/tempin-pc.html">PC 보기</a><a class="button" href="pages/tempin-mobile.html">모바일 보기</a></nav>
      </article>
    </section>

    <footer>FILT · INTERNAL PREVIEW</footer>
  </main>
</body>
</html>
