<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FILT Builder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css">
  <link rel="stylesheet" href="/builder/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-brand">FILT.</div>
    <div class="login-sub">Builder</div>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
      <button type="submit">로그인</button>
    </form>
    <div id="loginError" class="error-msg"></div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = document.getElementById('pw').value;
      const r = await fetch('/api/builder', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'login', password: pw})
      });
      if (r.ok) {
        location.href = '/builder/editor.html?project=tempin';
      } else {
        document.getElementById('loginError').textContent = '비밀번호가 틀렸습니다.';
      }
    });
  </script>
</body>
</html>
